services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-inventario_db}
      DB_USER: ${DB_USER:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:-inventario_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-inventario}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-inventario_dev_password}
      PRONOSTICO_SIMULAR_FALLO: ${PRONOSTICO_SIMULAR_FALLO:-false}
      COMPRAS_SIMULAR_FALLO: ${COMPRAS_SIMULAR_FALLO:-false}
      APP_SEED_EJEMPLO: ${APP_SEED_EJEMPLO:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: inventario-postgres
    restart: unless-stopped
    ports:
      - "5441:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-inventario_db}
      POSTGRES_USER: ${DB_USER:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventario} -d ${DB_NAME:-inventario_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inventario-rabbitmq
    restart: unless-stopped
    ports:
      - "5671:5672"
      - "15671:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inventario}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inventario_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
