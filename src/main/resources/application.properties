# Perfil por defecto: H2 en memoria para desarrollo local sin Docker.
spring.application.name=inventario-riesgo-quiebre
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:inventario}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:inventario_dev_password}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# true -> el pronostico falla y se usa el stock minimo (origen FALLBACK_MINIMO)
app.pronostico.simular-fallo=${PRONOSTICO_SIMULAR_FALLO:false}
# true -> el consumidor del sistema de compras falla y el mensaje va a la cola de errores
app.compras.simular-fallo=${COMPRAS_SIMULAR_FALLO:false}
app.seed.ejemplo=${APP_SEED_EJEMPLO:true}

logging.level.com.example=INFO
