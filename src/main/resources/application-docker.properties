# Configuración para Docker con PostgreSQL
spring.application.name=inventario-riesgo-quiebre
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:inventario_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:secretpassword123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
