# Perfil docker: PostgreSQL y RabbitMQ del compose (5432 y 5672 internos, 5441 y 5671 en el host).
spring.application.name=inventario-riesgo-quiebre
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:inventario_db}
spring.datasource.username=${DB_USER:inventario}
spring.datasource.password=${DB_PASSWORD:inventario_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:inventario}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:inventario_dev_password}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# true -> el pronostico falla y se usa el stock minimo (origen FALLBACK_MINIMO)
app.pronostico.simular-fallo=${PRONOSTICO_SIMULAR_FALLO:false}
# true -> el consumidor del sistema de compras falla y el mensaje va a la cola de errores
app.compras.simular-fallo=${COMPRAS_SIMULAR_FALLO:false}
app.seed.ejemplo=${APP_SEED_EJEMPLO:true}

logging.level.com.example=INFO
